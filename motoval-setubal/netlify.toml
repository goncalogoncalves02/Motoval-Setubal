# Configuração Netlify para Vite + React SPA

[build]
  # Comando de build
  command = "npm run build"
  # Pasta de publicação (onde ficam os ficheiros após o build)
  publish = "dist"

# Preserva os URLs antigos do catálogo com redirects permanentes
[[redirects]]
  from = "/ofertas"
  to = "/pneus"
  status = 301

[[redirects]]
  from = "/ofertas/*"
  to = "/pneus/:splat"
  status = 301

# Redireciona todas as rotas restantes para a SPA
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Headers de segurança e cache
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
